# One small request per row of SOURCES.md, for `riksdata check-sources`.
#
# A check proves that a source can be reached from where the command runs. It is not ingestion:
# the command reads at most `max_bytes` (default 64 KB) of one response and never retries.
#
#   url          the request to send. Exactly one of `url` and `skip` is required
#   expect       text that must be in the sampled body for status `ok`. Without `expect` or
#                `expect_type`, an answer only counts as `reachable`
#   expect_type  text that must be in the Content-Type header
#   needs_key    env var that would hold the (free) key. We send no key, so 401/403 is expected
#   pii: true    the response holds person-level data, so no sample is kept (SOURCES.md A3)
#   skip         why the row is not requested at all (never-use rows, paid data, no endpoint)
#   access       how the source hands out its data: api | file | page | docs | manual |
#                unknown | none. The classes are described in docs/v2/source-checks.md
#
# `section` is the SOURCES.md section and `priority` its Pri column ("-" = don't use).

