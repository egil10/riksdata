# Our World in Data grapher charts. Format: PLAN.md §5. Details: docs/v2/sources/owid.md.
#
# `dataset` is the chart slug in https://ourworldindata.org/grapher/<slug>. Every chart is
# filtered to the same comparison set: the Nordics, Germany, the UK, the US and the world.
# Titles, units, citations and licences come from OWID's metadata. Defaults: publish: true.
#
# `terms_note` is shown beside the licence on the site. A chart needs one when OWID records an
# upstream licence that is not an open one; `validate` fails a published series without it.
# Egil decided on 2026-10-03 to publish these for non-commercial use with attribution. A new
# chart with such a licence starts as `publish: false` until Egil has decided.

- dataset: life-expectancy
  title_no: Forventet levealder ved fødsel
  topic: health
  entities: [NOR, SWE, DNK, FIN, ISL, DEU, GBR, USA, OWID_WRL]
  schedule: weekly
  terms_note: "Bearbeidet av Our World in Data fra flere kilder. Én historisk kilde (Riley, via JSTOR) har egne vilkår. Brukt med kildehenvisning."

- dataset: co-emissions-per-capita
  title_no: CO₂-utslipp per innbygger
  topic: climate
  entities: [NOR, SWE, DNK, FIN, ISL, DEU, GBR, USA, OWID_WRL]
  schedule: weekly
  real_zeros: true   # Norway is 0 in 1832-1834, between years of very small emissions

- dataset: children-per-woman-un
  title_no: Samlet fruktbarhetstall (barn per kvinne)
  topic: population
  entities: [NOR, SWE, DNK, FIN, ISL, DEU, GBR, USA, OWID_WRL]
  schedule: weekly

- dataset: homicide-rate-unodc
  title_no: Drap per 100 000 innbyggere
  topic: crime
  entities: [NOR, SWE, DNK, FIN, ISL, DEU, GBR, USA, OWID_WRL]
  schedule: weekly
  real_zeros: true   # Iceland had no homicides in 1998, 2006 and 2008
  terms_note: "Data fra UNODC (© United Nations) via Our World in Data. Brukt ikke-kommersielt med kildehenvisning."

- dataset: military-spending-as-a-share-of-gdp-sipri
