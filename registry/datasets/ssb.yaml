# SSB Statbank tables (PxWeb API v2). Format: PLAN.md §5. Details: docs/v2/sources/ssb.md.
#
# The codes were read from each table's /metadata on 2026-10-03. `select` lists explicit codes
# for every dimension and uses "*" only for Tid, so new periods arrive on their own while the
# set of series stays pinned here. `series_key` names every non-time dimension in table order,
# so series ids don't change if a selection is widened later.
# Quote ids and codes made of digits. Defaults: publish: true, superseded_by: null.

- dataset: "14710"
  slug: kpi
  title_no: Konsumprisindeks (2025=100)
  title_en: Consumer price index (2025=100)
  topic: prices
  frequency: M
  select:
    ContentsCode: [KpiIndMnd]   # the table's only content
    Tid: ["*"]
  series_key: [ContentsCode]
  entity: NOR
  schedule: daily

- dataset: "13760"
  slug: aku
  title_no: Arbeidskraftundersøkelsen, sesongjustert, 15–74 år
  title_en: Labour force survey, seasonally adjusted, ages 15–74
  topic: labour
  frequency: M
  select:
    Kjonn: ["0"]                # both sexes
    Alder: ["15-74"]
    Justering: [S]              # seasonally adjusted (SSB also offers trend: T)
    ContentsCode: [Arbeidsstyrken, Sysselsatte, ArbledProsArbstyrk]
    Tid: ["*"]
  series_key: [Kjonn, Alder, Justering, ContentsCode]
  entity: NOR
  schedule: daily

- dataset: "05803"
  slug: befolkning
  title_no: Befolkning og befolkningsendringer
  title_en: Population and population changes
  topic: population
  frequency: A
  select:
    # InngEkteskap (marriages) and Skilsmisse (divorces) are left out: SSB publishes them
    # as 0, with no status flag, for 2021-2023 and 2025. See docs/v2/sources/ssb.md.
    ContentsCode:
      - Personer
      - Levendefodte
      - Levendefodte2
      - Dodfodte
      - Dode
      - Dode2
      - Innflyttinger
      - Utflyttinger
      - Levendef3
      - Dode3
      - AbsTilvekst
      - Tilvekst
    Tid: ["*"]
  series_key: [ContentsCode]
  entity: NOR
  schedule: weekly

- dataset: "14669"
  slug: offentlige-utgifter
  title_no: Offentlig forvaltnings utgifter etter formål
  title_en: General government expenditure by function
  topic: public_finance
  frequency: A
  select:
    Sektor: [C_OFF]             # general government (central + local, consolidated)
    Art: [E]                    # total expenditure
    # All functions, then the ten COFOG divisions.
    Formaal: ["0", "01", "02", "03", "04", "05", "06", "07", "08", "09", "10"]
    ContentsCode: [Belop]
    Tid: ["*"]
  series_key: [Sektor, Art, Formaal, ContentsCode]
  entity: NOR
  schedule: weekly

- dataset: "07391"
  slug: skatt
  title_no: Innbetalt skatt etter art, akkumulert gjennom året
  title_en: Taxes paid by type, accumulated through the year
  topic: public_finance
  frequency: M
  select:
    Ordning: ["0"]              # all tax arrangements
    Art: [A, B2, C, D, E, F2, G2, H, I2, J]   # total, then every tax type in the table
    ContentsCode: [Skatterekneskap]
    Tid: ["*"]
  series_key: [Ordning, Art, ContentsCode]
  entity: NOR
  schedule: daily

- dataset: "12439"
  slug: sykefravaer
  title_no: Sykefravær for lønnstakere
  title_en: Sickness absence for employees
  topic: labour
  frequency: Q
  select:
    Kjonn: ["0", "1", "2"]
    Sykefraver2: [Alt, E, L]    # all, self-certified, certified by doctor
    # Seasonally adjusted rate, and the seasonally and influenza adjusted rate. SSB notes
    # that only the latter is comparable across the 2014/2015 change of data source.
    ContentsCode: [SykefravProsSesJust, SykefravProsSesInflu]
    Tid: ["*"]
  series_key: [Kjonn, Sykefraver2, ContentsCode]
  entity: NOR
  schedule: daily

- dataset: "09842"
  slug: bnp-per-innbygger
  title_no: BNP og andre hovedstørrelser per innbygger
  title_en: GDP and other main aggregates per capita
  topic: economy
  frequency: A
  select:
    ContentsCode: [BNP, BNI, NI, DispINorge, KonsumHIO, MEMOBNP]
    Tid: ["*"]
  series_key: [ContentsCode]
  entity: NOR
  schedule: weekly

# --- Added 2026-10-03 for the beta page (codes read from each table's /metadata that day) ---

- dataset: "10318"
  slug: formuesfordeling
  title_no: Andel av samlet nettoformue
  title_en: Share of total net wealth
  topic: wealth
  frequency: A
  select:
    # The ten deciles, then the top 5, 1 and 0.1 per cent. "Ialt" (always 100) is left out.
    Desiler: ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "05b", "01b", "01c"]
    ContentsCode: [Nettoformue]
    Tid: ["*"]
  series_key: [Desiler, ContentsCode]
  entity: NOR
  schedule: weekly

- dataset: "08815"
  slug: formuesskatt
  title_no: Skattepliktig formue, gjeld og formuesskatt
  title_en: Taxable wealth, debt and wealth tax
  topic: tax
  frequency: A
  select:
    Formue2: ["12", "13", "15", "18"]   # gross wealth, debt, net wealth, wealth tax
    ContentsCode: [BosatteKr, BosattePersoner]   # residents aged 17+: amount and persons
    Tid: ["*"]
  series_key: [Formue2, ContentsCode]
  entity: NOR
  schedule: weekly

- dataset: "13151"
  slug: valgdeltakelse
  title_no: Valgdeltakelse
  title_en: Electoral turnout
  topic: democracy
  frequency: A
  select:
    Valgtype: ["2", "1"]        # Storting elections; municipal and county elections
    Kjonn: ["0"]                # both sexes
    ContentsCode: [Valgdeltakelse]
    Tid: ["*"]
  series_key: [Valgtype, Kjonn, ContentsCode]
  entity: NOR
  schedule: weekly

- dataset: "07221"
  slug: boligpriser
  title_no: Prisindeks for brukte boliger (2015=100)
  title_en: Price index for existing dwellings (2015=100)
  topic: housing
  frequency: Q
  select:
    Region: [TOTAL]             # the whole country
    Boligtype: ["00"]           # all dwelling types
    ContentsCode: [Boligindeks, SesJustBoligindeks]
    Tid: ["*"]
  series_key: [Region, Boligtype, ContentsCode]
  entity: NOR
  schedule: weekly

- dataset: "09695"
  slug: konkurser
  title_no: Åpnede konkurser
  title_en: Bankruptcies
  topic: economy
  frequency: M
  select:
    ContentsCode: [Konkursar]   # the table's only content
    Tid: ["*"]
  series_key: [ContentsCode]
  entity: NOR
  schedule: daily

- dataset: "08484"
  slug: anmeldte-lovbrudd
  title_no: Anmeldte lovbrudd per 1000 innbyggere
  title_en: Offences reported per 1,000 population
  topic: crime
  frequency: A
  select:
    # All groups, then the nine groups of offence. The table also has an older "type of
    # offence" classification whose codes differ only in the case of the last letter.
    LovbruddKrim:
      - 1AAAAA-9ZZZZz
      - 1AAAAA-1ZZZZz
      - 2AAAAA-2ZZZZz
      - 3AAAAA-3ZZZZz
      - 4AAAAA-4ZZZZz
      - 5AAAAA-5ZZZZz
      - 6AAAAA-6ZZZZz
      - 7AAAAA-7ZZZZz
      - 8AAAAA-8ZZZZz
      - 9AAAAA-9ZZZZz
    ContentsCode: [AnmLovbrPer1000]
    Tid: ["*"]
  series_key: [LovbruddKrim, ContentsCode]
  entity: NOR
  schedule: weekly
